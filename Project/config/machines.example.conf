# Remote machines are stored locally by the main monitor only.
# Format: id|display_name|host|username|port
# No passwords and no private keys are stored here.
#
# IP-only Quick Connect normally stores __ssh_config__ as the internal username marker.
# That tells the backend to let OpenSSH choose the account from ~/.ssh/config or the
# normal local SSH default. Example:
# lab-laptop|lab-laptop|192.168.1.42|__ssh_config__|22
#
# The older explicit-user API is still supported when needed:
# aryan-laptop|Aryan Laptop|192.168.1.42|aryan|22
